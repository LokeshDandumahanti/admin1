<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Queries</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="sign-in" class="container">
        <h1>Admin Queries</h1>
        <p>Common guys, we are working</p>
        <form id="sign-in-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <select id="room-letter">
                <option value="R">R</option>
                <option value="T">T</option>
                <option value="S">S</option>
                <option value="F">F</option>
                <option value="G">G</option>
            </select>
            <input type="number" id="room-number-1" placeholder="Room Number (1st digit)" min="0" max="9" required>
            <input type="number" id="room-number-2" placeholder="Room Number (2nd digit)" min="0" max="9" required>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <div id="query-form" class="container" style="display: none;">
        <h1>Submit Your Query</h1>
        <p>Please fill in the details below to submit your query. Our team will address it by 9 pm today.</p>
        <form id="submit-query-form">
            <input type="text" id="name" placeholder="Name" required>
            <input type="text" id="club-name" placeholder="Club Name" required>
            <input type="text" id="club-designation" placeholder="Club Designation" required>
            <textarea id="notification" placeholder="Enter any notifications you want to send or receive." required></textarea>
            <textarea id="changes-in-site" placeholder="Suggest or report changes needed on the website." required></textarea>
            <textarea id="others" placeholder="Any other information or queries." required></textarea>
            <button type="submit">Submit Query</button>
        </form>
    </div>

    <div id="view-queries" class="container" style="display: none;">
        <h1>View Queries (Only for Admin)</h1>
        <input type="password" id="admin-password" placeholder="Enter Password">
        <button id="view-queries-btn">View Queries</button>
        <div id="queries-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<style>
body {
    background-color: #121212;
    color: #ffffff;
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
    background-color: #1e1e1e;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
}

h1 {
    text-align: center;
    font-size: 2.5em;
    margin-bottom: 10px;
}

p {
    text-align: center;
    font-size: 1.2em;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input, select, textarea {
    padding: 10px;
    border: 1px solid #333;
    border-radius: 5px;
    background-color: #2a2a2a;
    color: #ffffff;
}

button {
    padding: 10px;
    background-color: #ff5722;
    border: none;
    border-radius: 5px;
    color: #ffffff;
    font-size: 1.2em;
    cursor: pointer;
}

button:hover {
    background-color: #e64a19;
}

#queries-list {
    margin-top: 20px;
    padding: 10px;
    background-color: #2a2a2a;
    border-radius: 5px;
}
</style>

<script>
// Simulated users data (replace with actual data source)
const users = {
    'a': { password: 'a', room_number: 'R01' },
    'Dibendhu747': { password: 'Ghosh1234', room_number: 'R22' },
    'user2': { password: 'password2', room_number: 'T12' },
    'user3': { password: 'password3', room_number: 'S34' }
};

// Simulated queries storage
let queries = [];

// Sign-in form handling
document.getElementById('sign-in-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const roomLetter = document.getElementById('room-letter').value;
    const roomNumber1 = document.getElementById('room-number-1').value;
    const roomNumber2 = document.getElementById('room-number-2').value;
    const roomNumber = `${roomLetter}${roomNumber1}${roomNumber2}`;

    if (users[username] && users[username].password === password && users[username].room_number === roomNumber) {
        document.getElementById('sign-in').style.display = 'none';
        document.getElementById('query-form').style.display = 'block';
        document.getElementById('view-queries').style.display = 'block';
    } else {
        alert('Invalid username, password, or room number.');
    }
});

// Query submission form handling
document.getElementById('submit-query-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const name = document.getElementById('name').value;
    const clubName = document.getElementById('club-name').value;
    const clubDesignation = document.getElementById('club-designation').value;
    const notification = document.getElementById('notification').value;
    const changesInSite = document.getElementById('changes-in-site').value;
    const others = document.getElementById('others').value;
    const timestamp = new Date().toLocaleString();

    const query = { timestamp, name, clubName, clubDesignation, notification, changesInSite, others };
    queries.push(query);
    alert('Your query has been submitted and will be addressed by 9 pm today.');
    this.reset();
});

// View queries button handling
document.getElementById('view-queries-btn').addEventListener('click', function() {
    const password = document.getElementById('admin-password').value;
    if (password === 'Dora') {
        const queriesList = document.getElementById('queries-list');
        queriesList.innerHTML = '';
        if (queries.length === 0) {
            queriesList.innerHTML = '<p>No queries submitted yet.</p>';
        } else {
            queries.forEach(query => {
                const queryDiv = document.createElement('div');
                queryDiv.classList.add('query');
                queryDiv.innerHTML = `
                    <p><strong>Timestamp:</strong> ${query.timestamp}</p>
                    <p><strong>Name:</strong> ${query.name}</p>
                    <p><strong>Club Name:</strong> ${query.clubName}</p>
                    <p><strong>Club Designation:</strong> ${query.clubDesignation}</p>
                    <p><strong>Notification:</strong> ${query.notification}</p>
                    <p><strong>Changes in Site:</strong> ${query.changesInSite}</p>
                    <p><strong>Others:</strong> ${query.others}</p>
                `;
                queriesList.appendChild(queryDiv);
            });
        }
    } else {
        alert('Incorrect password. Please try again.');
    }
});
</script>
